name: github-pages
on:
  push:
    branches: [main, arena/01a0fd1a-dashboard]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar site
        run: |
          mkdir -p _site
          cp index.html edgecontrol-glass-v2.html edgecontrol-glass.html sw.js _site/
          cp -f 404.html _site/ 2>/dev/null || cp index.html _site/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
